{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "telemetry.fullname" . }}-ingress
  namespace: {{ .Values.global.namespace }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.hosts.chirpstack }}
        - {{ .Values.ingress.hosts.grafana }}
      secretName: {{ .Values.global.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.hosts.chirpstack }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "telemetry.fullname" . }}-chirpstack
                port:
                  number: 8080
{{- end }}
