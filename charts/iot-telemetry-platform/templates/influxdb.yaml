apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "telemetry.fullname" . }}-influxdb
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: tsdb
spec:
  serviceName: {{ include "telemetry.fullname" . }}-influxdb-hl
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "telemetry.name" . }}
      app.kubernetes.io/component: tsdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "telemetry.name" . }}
        app.kubernetes.io/component: tsdb
    spec:
      containers:
        - name: influxdb
          image: "{{ .Values.influxdb.image.repository }}:{{ .Values.influxdb.image.tag }}"
          ports:
            - name: http
              containerPort: 8086
          resources:
            {{- toYaml .Values.influxdb.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "telemetry.fullname" . }}-influxdb
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8086
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: {{ include "telemetry.name" . }}
    app.kubernetes.io/component: tsdb
