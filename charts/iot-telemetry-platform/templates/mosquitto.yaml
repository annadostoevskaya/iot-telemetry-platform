apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "telemetry.fullname" . }}-mosquitto
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: mqtt-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "telemetry.name" . }}
      app.kubernetes.io/component: mqtt-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "telemetry.name" . }}
        app.kubernetes.io/component: mqtt-broker
    spec:
      containers:
        - name: mosquitto
          image: "{{ .Values.mosquitto.image.repository }}:{{ .Values.mosquitto.image.tag }}"
          ports:
            - name: mqtt
              containerPort: {{ .Values.mosquitto.service.mqttPort }}
            - name: websocket
              containerPort: {{ .Values.mosquitto.service.wsPort }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "telemetry.fullname" . }}-mosquitto
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.mosquitto.service.mqttPort }}
      targetPort: mqtt
      name: mqtt
    - port: {{ .Values.mosquitto.service.wsPort }}
      targetPort: websocket
      name: websocket
  selector:
    app.kubernetes.io/name: {{ include "telemetry.name" . }}
    app.kubernetes.io/component: mqtt-broker
