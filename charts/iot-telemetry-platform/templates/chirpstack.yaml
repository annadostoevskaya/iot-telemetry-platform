apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "telemetry.fullname" . }}-chirpstack
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: lorawan-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "telemetry.name" . }}
      app.kubernetes.io/component: lorawan-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "telemetry.name" . }}
        app.kubernetes.io/component: lorawan-server
    spec:
      containers:
        - name: chirpstack
          image: "{{ .Values.chirpstack.image.repository }}:{{ .Values.chirpstack.image.tag }}"
          ports:
            - name: api
              containerPort: 8080
          resources:
            {{- toYaml .Values.chirpstack.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "telemetry.fullname" . }}-chirpstack
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: api
      name: api
  selector:
    app.kubernetes.io/name: {{ include "telemetry.name" . }}
    app.kubernetes.io/component: lorawan-server
